<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toll Gate Innovations (Multi-Threaded)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'JetBrains Mono', monospace; }
        canvas { transform: scaleX(-1); }
        .highway-grid {
            background-color: #0f172a;
            background-image: linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }
    </style>
</head>
<body class="text-slate-300 min-h-screen flex flex-col items-center justify-center p-4 highway-grid">

    <div class="w-full max-w-5xl flex flex-col md:flex-row justify-between items-start md:items-end mb-4 border-b border-slate-700 pb-3 gap-4">
        <div>
            <h1 class="text-xl md:text-2xl font-bold text-white uppercase">TOLL GATE INNOVATIONS</h1>
            <p class="text-xs text-sky-400 mt-2 font-bold tracking-widest">SYSTEM: WEB_WORKER_ASYNC</p>
        </div>
        <div class="flex flex-col items-start md:items-end bg-slate-800/50 p-2 rounded border border-slate-700">
            <div id="api-status" class="flex items-center gap-2 text-xs font-bold text-slate-400">
                <div class="w-2 h-2 rounded-full bg-amber-400"></div> INITIALIZING WORKER
            </div>
            <div class="text-[10px] text-slate-500 mt-1">AI THREAD FPS: <span id="fps-meter" class="text-slate-300">0</span></div>
        </div>
    </div>

    <div class="relative w-full max-w-5xl aspect-video bg-black rounded-lg border-2 border-slate-700 overflow-hidden shadow-2xl">
        
        <div id="start-screen" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-slate-900/90 backdrop-blur-md">
            <button id="start-btn" onclick="initSystem()" class="px-6 py-3 font-bold text-slate-900 bg-amber-400 hover:bg-amber-300 rounded transition-all">
                CONNECT CAMERA
            </button>
        </div>

        <video id="webcam" class="hidden" playsinline muted></video>
        <canvas id="output" class="w-full h-full object-cover"></canvas>

        <div class="absolute top-4 left-4 z-20">
            <div class="bg-slate-900/90 border-l-4 border-amber-400 p-4 shadow-lg">
                <div class="text-[10px] text-amber-400 uppercase tracking-widest mb-1 font-bold">Vehicles In Zone</div>
                <div id="car-count" class="text-5xl font-bold text-white tabular-nums leading-none">0</div>
            </div>
        </div>
    </div>

    <script id="worker-script" type="javascript/worker">
        importScripts('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs');
        importScripts('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd');

        let model = null;

        // Initialize Model
        cocoSsd.load({ base: 'lite_mobilenet_v2' }).then(loadedModel => {
            model = loadedModel;
            postMessage({ type: 'ready' });
        });

        // Listen for frames from the main thread
        onmessage = async (e) => {
            if (!model || e.data.type !== 'analyze') return;
            
            const imageData = e.data.imageData;
            const vehicleClasses = ['car', 'truck', 'bus', 'motorcycle'];
            
            try {
                const predictions = await model.detect(imageData);
                const vehicles = predictions.filter(p => vehicleClasses.includes(p.class));
                postMessage({ type: 'results', data: vehicles });
            } catch (err) {
                console.error("Worker Error:", err);
            }
        };
    </script>

    <script>
        const LANE_COLOR = '#fbbf24';
        let stream, worker;
        let isRunning = false;
        let currentPredictions = [];
        let lane = { x: 0, y: 0, w: 0, h: 0 };
        let isWorkerBusy = false;
        let lastFrameTime = Date.now();
        
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const startScreen = document.getElementById('start-screen');
        const statusEl = document.getElementById('api-status');
        const countDisplay = document.getElementById('car-count');
        const fpsMeter = document.getElementById('fps-meter');

        // Setup the Web Worker using a Blob
        const workerCode = document.getElementById('worker-script').textContent;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        worker = new Worker(URL.createObjectURL(blob));

        worker.onmessage = (e) => {
            if (e.data.type === 'ready') {
                statusEl.innerHTML = `<div class="w-2 h-2 rounded-full bg-slate-500"></div> STANDBY`;
            } else if (e.data.type === 'results') {
                currentPredictions = e.data.data;
                isWorkerBusy = false; // Free the worker to take the next frame
                
                // Calculate AI FPS
                const now = Date.now();
                fpsMeter.innerText = Math.round(1000 / (now - lastFrameTime));
                lastFrameTime = now;
            }
        };

        window.initSystem = async () => {
            startScreen.classList.add('hidden');
            statusEl.innerHTML = `<div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div> CAMERA ACTIVE`;
            
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
            
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                updateLane();
                isRunning = true;
                requestAnimationFrame(renderLoop);
            };
        };

        function updateLane() {
            const w = canvas.width * 0.5;
            const h = canvas.height * 0.7;
            lane = { x: (canvas.width - w) / 2, y: (canvas.height - h) / 2, w, h };
        }

        function renderLoop() {
            if (!isRunning) return;

            // 1. Draw Video instantly (Smooth 60FPS)
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // 2. Send frame to AI Worker ONLY if it isn't currently busy processing one
            if (!isWorkerBusy && video.readyState === 4) {
                isWorkerBusy = true;
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                worker.postMessage({ type: 'analyze', imageData: imageData });
            }

            // 3. Draw Lane
            ctx.save();
            ctx.strokeStyle = LANE_COLOR;
            ctx.lineWidth = 4;
            ctx.setLineDash([15, 10]); 
            ctx.strokeRect(lane.x, lane.y, lane.w, lane.h);
            ctx.restore();

            // 4. Draw latest known predictions
            let validCount = 0;
            currentPredictions.forEach(box => {
                const [x, y, w, h] = box.bbox;
                const cx = x + (w / 2);
                const cy = y + (h / 2);
                
                const isInLane = (cx >= lane.x && cx <= (lane.x + lane.w) && cy >= lane.y && cy <= (lane.y + lane.h));
                if (isInLane) validCount++;

                ctx.strokeStyle = isInLane ? '#10b981' : '#f97316';
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, w, h);
            });

            countDisplay.innerText = validCount;
            requestAnimationFrame(renderLoop);
        }

        window.addEventListener('resize', () => {
            if (video.readyState === 4) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                updateLane();
            }
        });
    </script>
</body>
</html>
